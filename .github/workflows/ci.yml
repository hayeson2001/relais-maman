# Intégration continue : contrôles uniquement. AUCUN déploiement automatique.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verifications:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: relais
          POSTGRES_PASSWORD: relais-ci-only
          POSTGRES_DB: relais_maman_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U relais" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      APP_SECRET: ci-app-secret-0123456789abcdef0123456789abcdef
      DATABASE_URL: postgresql://relais:relais-ci-only@127.0.0.1:5432/relais_maman_test
      TEST_DATABASE_URL: postgresql://relais:relais-ci-only@127.0.0.1:5432/relais_maman_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Structure des langues et contrastes
        run: node scripts/i18n-sync.mjs --check && node scripts/contrast.mjs
      - name: Contrôle des types
        run: npm run typecheck
      - name: Tests unitaires et d'intégration (PostgreSQL réel)
        run: npm test
      - name: Prototype v0.1 conservé
        run: npm run legacy:test
      - name: Compilation
        run: npm run build
      - name: Évaluation reproductible du modèle
        run: npm run evaluate
      - name: Parcours navigateur
        run: npx playwright install --with-deps chromium && npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: rapport-playwright
          path: artifacts/playwright-report
