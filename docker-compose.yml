# Environnement local reproductible : PostgreSQL + stockage objet privé compatible S3.
# Données fictives uniquement. Aucun compte payant ni service externe requis.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: relais
      POSTGRES_PASSWORD: relais-local-only
      POSTGRES_DB: relais_maman
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./scripts/docker-init-test-db.sql:/docker-entrypoint-initdb.d/10-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relais"]
      interval: 5s
      retries: 10

  # Stockage privé compatible S3 pour les enregistrements audio (optionnel en local : par
  # défaut l'API utilise un répertoire privé sur disque, cf. STORAGE_DRIVER).
  # SeaweedFS plutôt que MinIO : le dépôt minio/minio n'est plus publié sur Docker Hub
  # (vérifié le 25/10/2026). Tag 4.50 vérifié publié le même jour.
  s3:
    image: chrislusf/seaweedfs:4.50
    command: server -s3 -dir=/data
    ports:
      - "9000:8333"
    volumes:
      - s3data:/data
    profiles: ["s3"]

volumes:
  pgdata:
  s3data:
